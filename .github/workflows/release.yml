name: release

on:
  push:
    tags:
      - "coordkit-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (coordkit-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          version="${tag#coordkit-v}"
          if ! [[ "$tag" =~ ^coordkit-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like coordkit-vX.Y.Z" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          version="$VERSION"
          python3 scripts/validate-package.py
          manifest_version="$(jq -r '.version' plugins/coordkit/.claude-plugin/plugin.json)"
          if [ "$manifest_version" != "$version" ]; then
            echo "Plugin manifest version ($manifest_version) does not match tag version ($version)" >&2
            exit 1
          fi

          if ! grep -Eq "^##[[:space:]]+$version([[:space:]]|\$)" plugins/coordkit/CHANGELOG.md; then
            echo "Changelog does not contain a section for version $version" >&2
            exit 1
          fi

      - name: Verify package and affected regressions
        shell: bash
        run: |
          base="$(git describe --tags --match 'coordkit-v*' --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD^)"
          selected="$(python3 scripts/select-tests.py --base "$base")"
          tests="$(printf '%s\n' tests/plugin-package.sh tests/validate-package.sh $selected | sort -u | tr '\n' ' ')"
          make test TESTS="$tests"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CoordKit ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
