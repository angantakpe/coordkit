# coord.toml — coordkit's committed, SECRET-FREE coordination pointer.
#
# This file is COMMITTED to the repo. A fresh clone reads it to self-describe and
# auto-join the right coordination mode/room with no extra setup. It is a POINTER,
# not a credential store.
#
# >>> NEVER put tokens, API keys, or any secret in this file. <<<
# Secrets live in the OS keychain or environment only, e.g.:
#   COORDKIT_RELAY_TOKEN   bearer token for the relay (relay mode)
# Git auth uses your normal git credentials (SSH key / credential helper).
#
# Every value here can be overridden at runtime by an env var (env wins over file):
#   mode      -> COORDKIT_MODE
#   room_id   -> COORDKIT_ROOM_ID
#   relay_url -> COORDKIT_RELAY_URL

# Active transport: "local" | "git" | "relay".
#   local : same-machine only (default). Zero network, zero deps.
#   git   : team async sharing over a plain git remote. No server, no daemon.
#   relay : optional real-time fan-out cache on top of a durable backing (degraded).
mode = "local"

# Logical coordination channel. All clones sharing a room see each other's events.
# Use one room per team/project; keep it stable across clones.
room_id = "default"

# Git mode: the remote that carries the committed coordination log. Empty = use the
# repo's existing default remote/branch. (No credentials here — git handles auth.)
remote = ""

# Relay mode: base URL of the fan-out relay (cache, NOT source of truth). Empty in
# git/local mode. The relay token is supplied out-of-band via COORDKIT_RELAY_TOKEN.
relay_url = ""

# Wire/protocol version of the event envelope. Kept in lock-step with
# schema/MANIFEST.json's `protocol` (both "2.0"). Bump when the schema changes so
# readers can refuse or adapt to lines they don't understand.
proto = "2.0"

# Minimum reader version required to safely interpret this room's events. Kept in
# lock-step with schema/MANIFEST.json's `min_reader` (both "2.0"). A clone older
# than this should warn rather than silently mis-read newer events.
min_reader = "2.0"

# ─────────────────────────────────────────────────────────────────────────────
# Everything ABOVE this line is the flat transport pointer, and it must stay
# above the first [table] header: the transport reader (transports/lib.sh) is a
# deliberately tiny TOML parser that stops at the first '['. Add new flat keys
# above, new tables below.
# ─────────────────────────────────────────────────────────────────────────────

# ENFORCEMENT — is coordkit allowed to hard-block a tool call in this repo?
# A DIFFERENT axis from the top-level `mode` transport key above (local/git/
# relay), which is about where events are shared. The table is named for the
# axis rather than `[mode]` precisely because that top-level `mode` key already
# exists — TOML forbids a bare key and a table sharing a name.
#
#   "warn"  — the default and coordkit's standing contract: the hooks observe
#             who else is live and warn softly on a collision, but NEVER deny a
#             tool call.
#   "guard" — additionally arm the anti-clobber guard: a Write/Edit to a file
#             that changed on disk since this session last Read it (or that this
#             session never Read) is DENIED until it is re-Read and reconciled.
#
# Override per-machine with COORDKIT_ENFORCEMENT=guard|warn, or per-user via
# `enforcement=guard` in $COORDKIT_DATA/config. Toggle with /guard on|off.
[enforcement]
mode = "warn"
